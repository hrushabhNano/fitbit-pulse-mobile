# Builds an installable APK of this fork on GitHub's machines, so no Android SDK or emulator is needed locally.
# Every push to a branch (and a manual run from the Actions tab) builds an arm64 APK and publishes it as a pre-release
# named after the branch, `preview-<branch>`, replacing the last one. Pre-releases are not "latest", so the in-app update
# notice (src/state/update.ts) never offers them. Open the pre-release on the phone and tap the .apk to install.
#
# Signing: Expo's prebuild template signs release builds with its debug keystore, the same on every run, so each new
# APK installs over the previous one and keeps its data.
name: APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # Gradle's caches (dependencies, build cache) and the C++ object cache survive between runs: the first build
      # compiles every native library from scratch (about an hour); later ones reuse it.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: apk-arm64
          max-size: 2G
      - run: pnpm install --frozen-lockfile
      - run: echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
      - run: npx expo prebuild --platform android --no-install
        env:
          CI: 1
      # The Gradle daemon's own memory (gradle.properties, not GRADLE_OPTS): the template's 512 MB of metaspace runs out on
      # this many native modules, and the daemon then hangs rather than failing.
      - run: |
          sed -i '/^org.gradle.jvmargs=/d' gradle.properties
          echo 'org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8' >> gradle.properties
          echo 'kotlin.daemon.jvmargs=-Xmx2g' >> gradle.properties
        working-directory: android
      # Each build a higher version code, so Android always takes it as an update.
      - run: sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" app/build.gradle
        working-directory: android
      - name: Build the release APK (arm64)
        run: ./gradlew assembleRelease --console=plain --build-cache --parallel -PreactNativeArchitectures=arm64-v8a
        working-directory: android
        env:
          USE_CCACHE: 1
          NDK_CCACHE: ccache
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
      - name: Name it
        id: name
        run: |
          branch="${GITHUB_REF_NAME//\//-}"
          version=$(jq -r .expo.version app.json)
          file="pulse-glow-${version}-${GITHUB_SHA::7}-arm64.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "tag=preview-$branch" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.file }}
          path: ${{ steps.name.outputs.file }}
      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.name.outputs.tag }}
          FILE: ${{ steps.name.outputs.file }}
        run: |
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" "$FILE" --prerelease --target "$GITHUB_SHA" \
            --title "Preview: ${GITHUB_REF_NAME}" \
            --notes "Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. Tap the .apk below on your phone to install (arm64)."
